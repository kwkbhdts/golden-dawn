name: Build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: golden-dawn
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            binary: golden-dawn.exe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare Rust
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --target ${{ matrix.target }}
          rustc +1.99.0 --version
          cargo +1.99.0 --version
      - name: Check formatting
        run: cargo +1.99.0 fmt -- --check
      - name: Build release
        run: cargo +1.99.0 build --locked --release --target ${{ matrix.target }}
      - name: Check executable path and local date
        run: |
          binary='./target/${{ matrix.target }}/release/${{ matrix.binary }}'
          # OSのローカル日付を返す。日付コマンドが失敗すると非0で終了する。
          os_date() {
            if [[ "$RUNNER_OS" == 'Windows' ]]; then
              pwsh -NoProfile -Command 'Get-Date -Format yyyy-MM-dd' | tr -d '\r'
            else
              date +%F
            fi
          }
          date_before=$(os_date)
          output=$("$binary" | tr -d '\r')
          date_after=$(os_date)
          printf '%s\n' "$output"
          mapfile -t lines <<< "$output"
          test "${#lines[@]}" -eq 2
          executable_path=${lines[0]}
          local_date=${lines[1]}
          if [[ "$RUNNER_OS" == 'Windows' ]]; then
            executable_path=$(cygpath -u "$executable_path")
          fi
          test "$executable_path" -ef "$binary"
          test "$local_date" = "$date_before" || test "$local_date" = "$date_after"
      - name: Inspect Linux runtime dependencies
        if: runner.os == 'Linux'
        run: |
          getconf GNU_LIBC_VERSION
          readelf -d target/${{ matrix.target }}/release/${{ matrix.binary }}
          readelf --version-info target/${{ matrix.target }}/release/${{ matrix.binary }} | grep -oE 'GLIBC_[0-9.]+' | sort -Vu
      - name: Check Windows CRT imports
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin was not found' }
          $dependencies = & $dumpbin /DEPENDENTS 'target/${{ matrix.target }}/release/${{ matrix.binary }}'
          if ($LASTEXITCODE -ne 0) { throw 'dumpbin failed' }
          $dependencies
          $dlls = @($dependencies | Where-Object { $_ -match '^\s*\S+\.dll\s*$' })
          if ($dlls.Count -eq 0) { throw 'No DLL imports were found' }
          if ($dlls -match '(vcruntime|msvcp|msvcr|ucrtbase|api-ms-win-crt|concrt|vccorlib)') {
            throw 'The executable imports a CRT runtime DLL'
          }
      - name: Upload executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-dawn-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 3
